<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Gateway</title>
<style>body{font:16px system-ui;background:#f3f6fa;color:#26354c;margin:0}main{max-width:1000px;margin:45px auto;padding:0 22px}.card{background:white;border:1px solid #dee5ef;border-radius:12px;padding:24px;margin:20px 0}textarea{width:100%;box-sizing:border-box;min-height:95px;padding:12px;border:1px solid #bdcce0;border-radius:8px;font:inherit}button{background:#315fa8;color:white;border:0;padding:11px 20px;border-radius:8px;margin:16px 12px 0 0;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}small,p{color:#697c96}label{margin-right:15px}table{width:100%;font-size:13px;text-align:left}td,th{padding:8px;border-bottom:1px solid #eee}.scroll{overflow:auto}</style>
<main><h1>AI Gateway</h1><p>统一调用入口 · 主备渠道 · 请求追踪</p><div class="card"><h2>模型调用</h2><p>当前模型 local-chat 使用本地适配器，不连接真实模型。</p><textarea id="prompt">介绍一下统一模型网关的作用</textarea><p><label><input type="checkbox" id="fail">模拟主渠道故障</label><label><input type="checkbox" id="stream" checked>流式输出</label></p><button id="send">发送请求</button><pre id="output"></pre><small id="meta"></small></div><div class="card"><h2>调用记录</h2><p id="quota"></p><div class="scroll"><table><thead><tr><th>Request ID</th><th>渠道</th><th>尝试</th><th>状态码</th></tr></thead><tbody id="events"></tbody></table></div></div></main>
<script>
const $=id=>document.getElementById(id),headers={Authorization:'Bearer local-gateway-key'};
async function refresh(){const response=await fetch('/api/status',{headers});if(!response.ok)throw Error('无法读取调用记录');const data=await response.json();$('quota').textContent=`剩余额度 ${data.remaining_units}（本地字符计数单位，非模型真实 Token）`;$('events').replaceChildren();for(const e of data.events.slice().reverse()){const row=document.createElement('tr');for(const value of [e.RequestID,e.ChannelID,e.Attempt,e.StatusCode]){const cell=document.createElement('td');cell.textContent=value;row.append(cell)}$('events').append(row)}}
$('send').onclick=async()=>{$('send').disabled=true;$('output').textContent='';$('meta').textContent='';try{const response=await fetch('/v1/chat/completions',{method:'POST',headers:{...headers,'Content-Type':'application/json','X-Local-Fail-Primary':String($('fail').checked)},body:JSON.stringify({model:'local-chat',messages:[{role:'user',content:$('prompt').value}],stream:$('stream').checked})});if(!response.ok){const error=await response.json();throw Error(error.error.message)}$('meta').textContent=`Request ${response.headers.get('X-Request-ID')} · Trace ${response.headers.get('X-Trace-ID')} · ${response.headers.get('X-Channel-ID')}`;if($('stream').checked){const reader=response.body.getReader(),decoder=new TextDecoder();let pending='';while(true){const {value,done}=await reader.read();pending+=decoder.decode(value||new Uint8Array(),{stream:!done});const parts=pending.split('\n\n');pending=parts.pop();for(const part of parts){const payload=part.replace(/^data: /,'');if(payload&&payload!=='[DONE]')$('output').textContent+=JSON.parse(payload).choices?.[0]?.delta?.content||''}if(done)break}}else{$('output').textContent=(await response.json()).choices[0].message.content}}catch(error){$('output').textContent=error.message}finally{$('send').disabled=false;refresh().catch(console.error)}};refresh().catch(error=>$('quota').textContent=error.message);
</script></html>
